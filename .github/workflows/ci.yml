---
name: CI

"on": [push]

jobs:
  skills-bootstrap:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init -- dotbot
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.12.16'
          python-version: '3.13'
      - run: uvx --python 3.13 --with pytest-mock==3.17.0 --with faker==40.43.0 pytest@9.2.0 tests -q
  shellcheck:
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v3
      - uses: ludeeus/action-shellcheck@2.0.0
        with:
          ignore: fish
  requirements_txt:
    name: Validate Python requirements
    runs-on: ubuntu-20.04
    strategy:
      matrix:
        python-version:
          - 2.x
          - 3.x
        requirements:
          - requirements/neovim.txt
          - requirements/system.txt
          - requirements/utils.txt
          - requirements.txt
        include:
          - python-version: 2.x
            continue-on-error: true
          - python-version: 3.x
            continue-on-error: false
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 1st pass
        run: pip install -r ${{ matrix.requirements }}
        continue-on-error: ${{ matrix.continue-on-error }}
      - name: 2nd pass
        run: pip install -r ${{ matrix.requirements }}
        continue-on-error: ${{ matrix.continue-on-error }}
