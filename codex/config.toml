approvals_reviewer = "user"

[desktop]
followUpQueueMode = "steer"

[marketplaces.openai-bundled]
source_type = "local"
source = "/Users/tomasztrebski/.codex/.tmp/bundled-marketplaces/openai-bundled"

[marketplaces.openai-primary-runtime]
source_type = "local"
source = "/Users/tomasztrebski/.cache/codex-runtimes/codex-primary-runtime/plugins/openai-primary-runtime"

[plugins."codex-app-tools@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."unified-computer-use@openai-bundled"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[mcp_servers.node_repl]
command = "/Applications/Codex.app/Contents/Resources/cua_node/bin/node_repl"
startup_timeout_sec = 120.0

[mcp_servers.node_repl.env]
BROWSER_USE_AVAILABLE_BACKENDS = "chrome,iab"
BROWSER_USE_CODEX_APP_BUILD_FLAVOR = "prod"
BROWSER_USE_CODEX_APP_VERSION = "26.908.70816"
BROWSER_USE_TINYSKY_ENABLED = "1"
CODEX_CLI_PATH = "/Applications/Codex.app/Contents/Resources/codex"
CODEX_HOME = "/Users/tomasztrebski/.codex"
NODE_REPL_INSTRUCTIONS_USE_CASE_BROWSER = ""
NODE_REPL_INSTRUCTIONS_USE_CASE_CHROME = ""
NODE_REPL_NATIVE_PIPE_CONNECT_TIMEOUT_MS = "1000"
NODE_REPL_NODE_MODULE_DIRS = "/Applications/Codex.app/Contents/Resources/cua_node/lib/node_modules"
NODE_REPL_NODE_PATH = "/Applications/Codex.app/Contents/Resources/cua_node/bin/node"
NODE_REPL_TRUSTED_CODE_PATHS = "/Users/tomasztrebski/.codex:/Applications/Codex.app/Contents/Resources/cua_node/lib/node_modules"
NODE_REPL_TRUSTED_SERVICES = '{"browser":"/Users/tomasztrebski/.codex/plugins/cache/openai-bundled/browser/26.908.70816/scripts/browser-service.mjs"}'

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
bearer_token_env_var = "CONTEXT7_API_KEY"

[mcp_servers.fetch]
command = "uvx"
args = ["mcp-server-fetch"]

[mcp_servers.web_search]
command = "uvx"
args = ["duckduckgo-mcp-server"]

[mcp_servers.atlassian_mvp]
command = "uvx"
args = ["mcp-atlassian"]

[mcp_servers.aws-mcp]
command = "uvx"
args = ["mcp-proxy-for-aws@latest", "https://aws-mcp.us-east-1.api.aws/mcp", "--metadata", "INSTALL_SOURCE=aws-cli"]

[tui]
screen_reader_detection_done = true
status_line = ["model-with-reasoning", "current-dir", "thread-name", "reasoning", "git-branch", "pull-request-number", "branch-changes", "run-state", "estimated-thread-cost"]
status_line_use_colors = true

[tui.model_availability_nux]
gpt-6-astra = 4
"gpt-6.1-sol" = 4
